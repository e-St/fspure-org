name: Publish control image

on:
  push:
    branches: [main]
    paths:
      - "image/**"
      - ".github/workflows/publish-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Image tag
        id: v
        run: |
          tag=$(tr -d ' \n' < image/VERSION)
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/e-st/bellen" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v4

      - uses: docker/build-push-action@v6
        with:
          context: image
          load: true
          tags: bellen:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke Agent Canvas on port 8000
        run: |
          docker run -d --name bellen-smoke \
            -e LOCAL_BACKEND_API_KEY=ci-smoke \
            -e TMUX_TMPDIR=/tmp \
            -p 8000:8000 \
            bellen:ci \
            bash -lc 'agent-canvas --public --port 8000'
          ok=0
          for i in $(seq 1 90); do
            if curl -sf -o /dev/null --max-time 2 http://127.0.0.1:8000/; then
              ok=1
              break
            fi
            sleep 2
          done
          docker logs bellen-smoke 2>&1 | tail -80
          docker rm -f bellen-smoke >/dev/null
          test "$ok" = 1

      - uses: docker/build-push-action@v6
        with:
          context: image
          push: true
          tags: |
            ${{ steps.v.outputs.image }}:${{ steps.v.outputs.tag }}
            ${{ steps.v.outputs.image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: |
            org.opencontainers.image.source=https://github.com/e-St/bellen
            org.opencontainers.image.version=${{ steps.v.outputs.tag }}

      - name: Make package public
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api --method POST \
            -H "Accept: application/vnd.github+json" \
            /user/packages/container/bellen/visibility \
            -f visibility=public \
            || true
